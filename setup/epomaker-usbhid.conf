# OPTIONAL — only if the F75 Ultra 2.4G dongle sleeps/drops after ~1 min idle on Linux.
# Research: this device (0c45:fefe, Microdia/Sonix HID relay) was added to the usbhid
# ALWAYS_POLL quirk table upstream (kernel 6.12-ish + stable backports). Our 6.8.0-147
# does NOT carry it (verified: quirk pattern absent from this kernel's usbhid.ko).
#
# How to apply:
#   sudo cp this file /etc/modprobe.d/epomaker-usbhid.conf
#   then either reboot, or: sudo modprobe -r usbhid && sudo modprobe usbhid
#   (module reload may fail while a HID device is in use — reboot is cleaner)
#
# Verify after boot:
#   cat /sys/module/usbhid/parameters/quirks   → should show 0c45:fefe:0x400
#
# HID_QUIRK_ALWAYS_POLL = 0x400. Safe: it just polls the device like Windows does.
# If the dongle never misbehaves for you, you can skip this file entirely.
options usbhid quirks=0x0c45:0xfefe:0x400
